[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/cbaumont/DumbJ"
publish = false

[workspace.dependencies]
dumbj-actions = { path = "crates/dumbj-actions" }
dumbj-index = { path = "crates/dumbj-index" }
dumbj-settings = { path = "crates/dumbj-settings" }
dumbj-syntax = { path = "crates/dumbj-syntax" }
dumbj-text = { path = "crates/dumbj-text" }
dumbj-ui = { path = "crates/dumbj-ui" }

anyhow = "1"

ignore = "0.4"
insta = "1.49"
proptest = "1.12"
# Line breaks are LF only (a preceding CR is handled by dumbj-text), so that line numbers
# agree with git, tree-sitter and LSP. Ropey's default also splits on lone CR, VT, FF, NEL, LS, PS.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
roxmltree = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
tree-sitter = "0.27"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"

# Pinned exactly: GPUI's API moves fast. Upgrade deliberately. Only dumbj-ui may depend on it.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e8bc16acee5ae1937600d571d441c4b5d7b0d288", features = ["wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Pedantic lints that are too noisy to be useful here:
# every fallible fn would need an `# Errors` section, and our error enums are self-describing.
missing_errors_doc = "allow"
# flags any fn that can reach an index or slice, even provably in-bounds ones.
missing_panics_doc = "allow"
# `#[must_use]` on every getter is noise; the important ones are annotated by hand.
must_use_candidate = "allow"
# `dumbj_text::TextError` style names are clearer at call sites than `text::Error`.
module_name_repetitions = "allow"

[profile.dev.package."*"]
# Fast dev builds: optimise dependencies, keep our own crates at opt-level 0.
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
split-debuginfo = "packed"
