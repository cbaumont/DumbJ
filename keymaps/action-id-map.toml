# IntelliJ action ID -> DumbJ action ID.
#
# The keymap loader binds a DumbJ action to whatever shortcuts the resolved IntelliJ keymap
# gives the IntelliJ action on the left. IntelliJ actions that are not listed here are
# ignored and show up in the loader's debug report.
#
# Notes on IDs:
# - OpenFile is IntelliJ's "Open..." action. It has no shortcut in any vendored keymap,
#   so Open Folder is unbound by default.

[actions]
OpenFile = "project.open-folder"
CloseContent = "tabs.close"
NextTab = "tabs.next"
PreviousTab = "tabs.previous"
ActivateProjectToolWindow = "tool-window.project"
HideAllWindows = "tool-window.hide-all"
GotoLine = "editor.goto-line"
Find = "editor.find"
FindNext = "editor.find-next"
FindPrevious = "editor.find-previous"
EditorSelectWord = "editor.extend-selection"
EditorUnSelectWord = "editor.shrink-selection"
CollapseRegion = "editor.fold"
ExpandRegion = "editor.unfold"
CollapseAllRegions = "editor.fold-all"
ExpandAllRegions = "editor.unfold-all"
GotoDeclaration = "navigate.goto-declaration"
Back = "navigate.back"
Forward = "navigate.forward"
SearchEverywhere = "navigate.search-everywhere"
GotoClass = "navigate.goto-class"
GotoFile = "navigate.goto-file"
GotoSymbol = "navigate.goto-symbol"
FileStructurePopup = "navigate.file-structure"
FindUsages = "navigate.find-usages"
ShowUsages = "navigate.show-usages"
ActivateFindToolWindow = "tool-window.find"
GotoImplementation = "navigate.goto-implementation"
GotoSuperMethod = "navigate.goto-super-method"
TypeHierarchy = "navigate.type-hierarchy"
CallHierarchy = "navigate.call-hierarchy"
ActivateHierarchyToolWindow = "tool-window.hierarchy"
FindInPath = "search.find-in-files"
RecentFiles = "navigate.recent-files"
RecentLocations = "navigate.recent-locations"
ToggleBookmark = "bookmarks.toggle"
ToggleBookmarkWithMnemonic = "bookmarks.toggle-with-mnemonic"
ShowBookmarks = "bookmarks.show"
ToggleBookmark0 = "bookmarks.toggle-0"
