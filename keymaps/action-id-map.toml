# IntelliJ action ID -> DumbJ action ID.
#
# The keymap loader binds a DumbJ action to whatever shortcuts the resolved IntelliJ keymap
# gives the IntelliJ action on the left. IntelliJ actions that are not listed here are
# ignored and show up in the loader's debug report.
#
# Notes on IDs:
# - OpenFile is IntelliJ's "Open..." action. It has no shortcut in any vendored keymap,
#   so Open Folder is unbound by default.

[actions]
OpenFile = "project.open-folder"
CloseContent = "tabs.close"
NextTab = "tabs.next"
PreviousTab = "tabs.previous"
ActivateProjectToolWindow = "tool-window.project"
HideAllWindows = "tool-window.hide-all"
GotoLine = "editor.goto-line"
Find = "editor.find"
FindNext = "editor.find-next"
FindPrevious = "editor.find-previous"
EditorSelectWord = "editor.extend-selection"
EditorLeft = "text.move-left"
EditorRight = "text.move-right"
EditorUp = "text.move-up"
EditorDown = "text.move-down"
EditorLineStart = "text.move-line-start"
EditorLineEnd = "text.move-line-end"
EditorTextStart = "text.move-text-start"
EditorTextEnd = "text.move-text-end"
EditorPageUp = "text.move-page-up"
EditorPageDown = "text.move-page-down"
EditorPreviousWord = "text.move-word-left"
EditorNextWord = "text.move-word-right"
EditorLeftWithSelection = "text.select-left"
EditorRightWithSelection = "text.select-right"
EditorUpWithSelection = "text.select-up"
EditorDownWithSelection = "text.select-down"
EditorLineStartWithSelection = "text.select-line-start"
EditorLineEndWithSelection = "text.select-line-end"
EditorTextStartWithSelection = "text.select-text-start"
EditorTextEndWithSelection = "text.select-text-end"
EditorPageUpWithSelection = "text.select-page-up"
EditorPageDownWithSelection = "text.select-page-down"
EditorPreviousWordWithSelection = "text.select-word-left"
EditorNextWordWithSelection = "text.select-word-right"
"$SelectAll" = "text.select-all"
"$Copy" = "text.copy"
"$Cut" = "text.cut"
"$Paste" = "text.paste"
EditorBackSpace = "text.backspace"
EditorDelete = "text.delete"
EditorEnter = "text.enter"
EditorEscape = "text.escape"
