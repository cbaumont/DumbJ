# cargo-deny configuration (BRIEF §7 and §8.1).

[graph]
# DumbJ targets Linux now and macOS later; Windows-only crates are not shipped.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = false

[advisories]
yanked = "deny"
# Unmaintained crates are only an error when we depend on them directly. The ones that
# come in through GPUI (font shaping, D-Bus) are for GPUI to replace.
unmaintained = "workspace"

[licenses]
# DumbJ is GPL-3.0-or-later: permissive licences plus (L)GPL-3 are compatible.
# GPL-2.0-only is not and must never be added here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    # Public-domain dedication; the FSF lists CC0 as GPL-compatible.
    "CC0-1.0",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.9

[licenses.private]
ignore = false

[bans]
# GPUI pulls in several versions of some crates; duplicates are reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own crates have no version, which is not a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI and the forks it depends on are only published from git.
allow-git = []

[sources.allow-org]
# gfx-rs: GPUI pins wgpu to a git revision.
github = ["zed-industries", "gfx-rs"]
